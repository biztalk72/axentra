# Docker DNS follows an API container replacement without restarting the web server.
upstream forge_api {
    zone forge_api 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server api:8000 resolve;
}
server {
    listen 8080;
    server_tokens off;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    client_max_body_size 2m;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location = /ready { default_type text/plain; return 200 "ready\n"; }
    location = /index.html { expires -1; }
    location /assets/ { try_files $uri =404; expires 1y; }
    location /api/ { proxy_pass http://forge_api; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location = /health { proxy_pass http://forge_api; }
    location = /openapi.json { proxy_pass http://forge_api; }
    location /docs { proxy_pass http://forge_api; }
    location / { try_files $uri $uri/ /index.html; }
}
